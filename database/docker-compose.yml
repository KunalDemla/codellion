services:
  db:
    image: postgres:17
    container_name: root-access-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: root_access
      POSTGRES_USER: root_access
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - root_access_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root_access -d root_access"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  root_access_pgdata:
